<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建大转盘 · GameHub</title><link rel="stylesheet" href="design-system.css"><body><main style="max-width:640px;margin:0 auto;padding:32px"><h1>创建大转盘</h1><p>填写奖项，立即试玩。</p><label>奖项（每行一个）<textarea id="prizes" rows="8" style="display:block;width:100%;margin:12px 0">惊喜大奖
精选好礼
咖啡券
谢谢参与</textarea></label><button id="preview" class="btn btn-primary">试玩</button><section id="game" style="margin-top:24px"></section><p id="message" aria-live="polite"></p></main><script src="games/wheel/config.js"></script><script src="games/wheel/engine.js"></script><script src="games/wheel/player.js"></script><script>document.getElementById('preview').onclick=function(){try{var config=GameHubWheelConfig.normalizeConfig({prizes:document.getElementById('prizes').value.split('\n').map(function(name){return{name:name,weight:1}}).filter(function(p){return p.name.trim()})}),game=document.getElementById('game');game.innerHTML='';GameHubWheelPlayer.createPlayer({config:config}).mount(game);var engine=GameHubWheelEngine.createEngine({config:config}),button=document.createElement('button');button.className='btn btn-primary';button.textContent='开始抽奖';button.onclick=function(){var r=engine.spin().complete();document.getElementById('message').textContent='结果：'+r.prize.name};game.appendChild(button);document.getElementById('message').textContent='预览已就绪'}catch(error){document.getElementById('message').textContent=error.message}};</script></body></html>
