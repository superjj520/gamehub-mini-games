<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建幸运转盘 · GameHub Studio</title><link rel="stylesheet" href="design-system.css"><style>
:root{--ink:#080912;--panel:#101324;--line:#29304b;--cyan:#45edd3;--pink:#ff5987;--gold:#ffc84d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 2%,#292559,transparent 31rem),var(--ink);color:#f2effb;font-family:var(--font-body)}button,input,select{font:inherit}.studio-top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(8,9,18,.85)}.studio-brand{font:900 18px var(--font-display);letter-spacing:-.05em}.studio-brand b{color:var(--pink)}.studio-top__actions{display:flex;gap:8px}.studio-top button{min-height:36px;border-radius:0}.studio-shell{display:grid;grid-template-columns:minmax(290px,360px) 1fr;min-height:calc(100dvh - 64px)}.studio-panel{padding:20px;border-right:1px solid var(--line);background:rgba(12,14,30,.74);overflow:auto}.studio-kicker{color:var(--cyan);font:800 10px var(--font-mono);letter-spacing:.12em}.studio-panel h1{margin:7px 0 18px;font-size:28px}.wheel-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border:1px solid var(--line);background:#090a16}.wheel-tabs button,.wheel-themes button,.wheel-preset{border:0;background:transparent;color:#a6a1b8;padding:10px 6px;cursor:pointer;font-weight:700;font-size:12px}.wheel-tabs .is-active{background:var(--cyan);color:#07100f}.wheel-panel{margin-top:14px;padding:15px;border:1px solid var(--line);background:#111428}.wheel-help{margin:0 0 13px;color:#9691a8;font-size:12px;line-height:1.55}.wheel-presets,.wheel-themes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.wheel-preset,.wheel-themes button{border:1px solid var(--line);color:#d6d1e2}.wheel-themes .is-active{color:#07100f;border-color:var(--cyan);background:var(--cyan)}.wheel-field{display:grid;gap:6px;margin:13px 0;color:#aaa5bb;font-size:12px;font-weight:700}.wheel-field input,.wheel-field select{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:0;background:#080a17;color:#f4f1ff;outline:0}.wheel-list{display:grid;gap:7px}.wheel-prize{display:grid;grid-template-columns:12px 1fr 72px 18px 22px;gap:7px;align-items:center}.wheel-color{width:12px;height:28px}.wheel-prize input[type=text],.wheel-prize input:not([type]){width:100%;height:32px;padding:0 8px;background:#080a17;border:1px solid var(--line);color:white}.wheel-prize b{font:800 11px var(--font-mono);color:var(--gold)}.wheel-prize button,.wheel-add{border:1px solid var(--line);background:#14182c;color:#c7c2d4;cursor:pointer}.wheel-add{width:100%;margin-top:10px;padding:9px}.wheel-check{display:block;margin:14px 0;color:#d7d2e2;font-size:13px}.wheel-range{display:grid;grid-template-columns:1fr auto;gap:7px;margin:13px 0;color:#b4aec4;font-size:12px}.wheel-range input{grid-column:1 / -1;accent-color:var(--cyan)}.studio-stage{display:grid;place-items:center;position:relative;padding:30px}.studio-stage__inner{display:grid;place-items:center;gap:18px;width:min(680px,100%)}.stage-meta{display:flex;justify-content:space-between;width:100%;color:#9892a9;font:800 10px var(--font-mono);letter-spacing:.1em}.stage-meta b{color:var(--cyan)}.wheel-player{position:relative;width:min(510px,75vw);filter:drop-shadow(0 18px 36px rgba(0,0,0,.45))}.wheel-svg{display:block;width:100%;overflow:visible}.wheel-rotor{transform-origin:250px 250px}.wheel-sector path{stroke:rgba(255,255,255,.26);stroke-width:1}.wheel-sector.is-winner path{filter:brightness(1.35);stroke:#fff;stroke-width:4}.wheel-label{fill:#090817;font:800 12px var(--font-display);pointer-events:none}.wheel-label-icon{font-size:18px}.wheel-core-ring{fill:#0b0d1c;stroke:rgba(255,255,255,.19);stroke-width:3}.wheel-core{fill:#0b0d1c;stroke:var(--cyan);stroke-width:3}.wheel-pointer{position:absolute;z-index:2;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 0 8px var(--gold))}.stage-spin{min-width:220px;border:0;padding:14px;background:var(--gold);box-shadow:inset 0 -4px 0 rgba(110,65,0,.3);color:#201500;font:900 15px var(--font-display);cursor:pointer}.stage-spin:disabled{opacity:.55;cursor:wait}.studio-message{min-height:20px;color:#b4aec4;font-size:12px}.studio-message a{color:var(--cyan);text-decoration:underline}@media(max-width:760px){.studio-shell{grid-template-columns:1fr}.studio-panel{order:2;border-right:0;border-top:1px solid var(--line)}.studio-stage{padding:24px 14px}.studio-top{padding:0 14px}.studio-top__actions button:first-child{display:none}}
</style><body><header class="studio-top"><div class="studio-brand">GAME<b>HUB</b> / WHEEL STUDIO</div><div class="studio-top__actions"><button class="btn btn-ghost" id="saveDraft">保存草稿</button><button class="btn btn-accent" id="publish">发布并获取链接</button></div></header><main class="studio-shell"><aside class="studio-panel"><p class="studio-kicker">CREATE / 幸运转盘</p><h1>配置这一局游戏</h1><section id="editor"></section></aside><section class="studio-stage"><div class="studio-stage__inner"><div class="stage-meta"><span>LIVE PREVIEW</span><b id="stageTheme">NEON</b></div><div id="wheel"></div><button class="stage-spin" id="previewSpin">试玩抽奖</button><p class="studio-message" id="message" aria-live="polite"></p></div></section></main><script src="games/wheel/config.js"></script><script src="games/wheel/engine.js"></script><script src="games/wheel/player.js"></script><script src="games/wheel/editor.js"></script><script src="platform/config/browser-config-service.js"></script><script src="platform/sharing/browser-share-service.js"></script><script>(function(){var current=GameHubWheelConfig.createDefaultConfig(),wheelHost=document.getElementById('wheel'),message=document.getElementById('message'),player,editor,draftId;var configs=GameHubBrowserConfigService.createBrowserConfigService(localStorage),shares=GameHubBrowserShareService.createBrowserShareService(localStorage);function render(){if(player)player.destroy();player=GameHubWheelPlayer.createPlayer({config:current});player.mount(wheelHost);document.getElementById('stageTheme').textContent=current.theme.toUpperCase()}function setMessage(text,link){message.innerHTML=link?text+' <a href="'+link+'" target="_blank">打开玩家页</a>':text}editor=GameHubWheelEditor.createEditor({config:current,onChange:function(next){current=next;render()}});editor.mount(document.getElementById('editor'));render();document.getElementById('previewSpin').onclick=async function(){var button=this,engine=GameHubWheelEngine.createEngine({config:current}),outcome=engine.spin().complete();button.disabled=true;await player.spin(outcome);setMessage('试玩结果：'+outcome.prize.icon+' '+outcome.prize.name);button.disabled=false};document.getElementById('saveDraft').onclick=async function(){var saved=await configs.save({id:draftId,gameType:'wheel',gameVersion:1,payload:current,status:'draft'});draftId=saved.id;setMessage('草稿已保存')};document.getElementById('publish').onclick=async function(){var saved=await configs.save({id:draftId,gameType:'wheel',gameVersion:1,payload:current,status:'draft'});draftId=saved.id;var reference=await shares.publish(saved),link='play-v2.html?game=wheel&config='+encodeURIComponent(reference);setMessage('已发布，分享这个链接给朋友：',link)};}())</script></body></html>
