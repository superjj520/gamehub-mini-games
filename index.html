<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GameHub · 玩家大厅</title>
  <link rel="stylesheet" href="design-system.css">
  <style>
    :root{--ink:#070712;--panel:#101126;--panel-deep:#080917;--violet:#7b57ff;--cyan:#3ff0d0;--hot:#ff4e82;--gold:#ffc64b;--line:rgba(205,198,255,.19)}
    *{box-sizing:border-box}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse at 50% 8%,#28205c 0,transparent 42%),radial-gradient(circle at 15% 88%,rgba(255,78,130,.14),transparent 26rem),var(--ink);color:#f5f2ff;font-family:var(--font-body)}a{text-decoration:none;color:inherit}
    .top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;max-width:1240px;margin:auto;padding:22px 30px}.brand{display:flex;align-items:center;gap:10px;font:900 21px/1 var(--font-display);letter-spacing:-.06em}.brand i{width:14px;height:14px;display:block;transform:rotate(45deg);background:var(--hot);box-shadow:0 0 18px var(--hot)}.brand b{color:var(--cyan)}.top nav{display:flex;align-items:center;gap:22px;color:#aaa7bc;font-size:13px}.top nav a:hover{color:white}.balance{padding:8px 11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--gold);font:800 11px var(--font-mono);letter-spacing:.05em}
    .floor{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.027) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 78%)}.floor:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 18px,rgba(255,255,255,.018) 19px 20px);opacity:.4}
    main{position:relative;z-index:1;width:min(1050px,100%);margin:10px auto 0;padding:20px 24px 72px;text-align:center}.prelude{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--cyan);font:800 11px var(--font-mono);letter-spacing:.12em}.prelude span{width:6px;height:6px;background:currentColor;border-radius:50%;box-shadow:0 0 14px currentColor;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.3;transform:scale(.6)}}h1{margin:17px auto 25px;font-size:clamp(30px,4.2vw,58px);line-height:1.08;letter-spacing:-.06em}h1 strong{color:var(--gold);font-weight:900}
    .machine{position:relative;width:min(800px,100%);margin:auto;padding:15px;background:linear-gradient(135deg,#ff5d8c,#ffc94e 29%,#55f3d2 56%,#895cff 83%,#ff5d8c);clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);box-shadow:0 0 0 1px rgba(255,255,255,.25),0 0 42px rgba(123,87,255,.45)}.machine:before{content:"";position:absolute;inset:5px;opacity:.95;background:radial-gradient(circle,#fff 0 2px,transparent 3px) 0 0/22px 22px;mix-blend-mode:overlay;pointer-events:none}.machine__body{position:relative;padding:30px 34px 28px;background:linear-gradient(145deg,#17183a,#080916 67%);clip-path:inherit}.machine__rail{display:flex;justify-content:space-between;margin-bottom:30px;color:#b1accd;font:800 10px var(--font-mono);letter-spacing:.13em}.machine__rail b{color:var(--cyan)}.screen{position:relative;padding:28px 26px 24px;border:1px solid rgba(92,254,221,.52);background:linear-gradient(135deg,rgba(11,26,47,.85),rgba(6,9,22,.92));box-shadow:inset 0 0 32px rgba(63,240,208,.08)}.screen:before,.screen:after{content:"";position:absolute;width:9px;height:9px;border-color:var(--cyan);border-style:solid}.screen:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.screen:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}.screen small{display:block;color:#8f8ba5;font:700 10px var(--font-mono);letter-spacing:.16em}.screen h2{margin:8px 0 7px;color:#f9f7ff;font-size:clamp(24px,3vw,36px);letter-spacing:-.04em}.screen p{color:#aaa7bc;font-size:13px}.open-form{display:flex;gap:8px;margin-top:22px}.open-form input{flex:1;min-width:0;height:50px;padding:0 15px;border:1px solid #393a62;background:#060713;color:#f7f5ff;outline:0;font:500 13px var(--font-body)}.open-form input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,240,208,.13)}.open-form button{min-width:154px;border:0;background:var(--gold);color:#1c1200;box-shadow:inset 0 -4px 0 rgba(125,71,0,.28);font:900 14px var(--font-display);cursor:pointer;letter-spacing:.02em}.open-form button:hover{filter:brightness(1.12);transform:translateY(-1px)}.form-message{min-height:18px;margin-top:10px;color:#7b7794;text-align:left;font-size:11px}.form-message.is-error{color:var(--hot)}
    .below{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;width:min(800px,100%);margin:25px auto 0}.below:before,.below:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--line))}.below:after{background:linear-gradient(90deg,var(--line),transparent)}.demo{display:inline-flex;align-items:center;gap:9px;color:#dcd8e9;font-size:13px}.demo em{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#ff4e82;color:#17040b;font-style:normal;font-weight:900}.demo:hover{color:var(--gold)}.chips{display:flex;justify-content:center;gap:10px;margin-top:42px}.chip{padding:7px 10px;border:1px solid var(--line);background:rgba(9,9,24,.58);color:#928da7;font:700 10px var(--font-mono);letter-spacing:.08em}.chip:nth-child(2){color:var(--cyan);border-color:rgba(63,240,208,.35)}.foot{margin-top:38px;color:#68647d;font:10px var(--font-mono);letter-spacing:.11em}
    @media(max-width:650px){.top{padding:18px}.top nav a{display:none}.balance{display:none}main{padding:25px 16px 50px}.machine{padding:10px}.machine__body{padding:20px 16px}.machine__rail{margin-bottom:20px}.screen{padding:23px 15px 18px}.open-form{display:block}.open-form input,.open-form button{width:100%}.open-form button{height:48px;margin-top:8px}.below{margin-top:20px}.chips{margin-top:30px}}
  </style>
</head>
<body>
  <div class="floor" aria-hidden="true"></div>
  <header class="top"><a class="brand" href="index.html"><i></i>GAME<b>HUB</b></a><nav><a href="leaderboard.html">排行榜</a><a href="player-history.html">游玩记录</a><span class="balance">PLAYER LOBBY</span></nav></header>
  <main>
    <p class="prelude"><span></span> GAME LINK RECEIVER / ONLINE</p>
    <h1>朋友发来一局游戏。<br><strong>现在，按下开始。</strong></h1>
    <section class="machine" aria-label="打开分享游戏">
      <div class="machine__body"><div class="machine__rail"><span>GAMEHUB PLAYER TERMINAL</span><b>READY / 01</b></div>
        <div class="screen"><small>INSERT A GAME LINK</small><h2>打开朋友分享的游戏</h2><p>进入后直接开玩。你不会改动创作者设置。</p>
          <form class="open-form" id="openGameForm" novalidate><input id="gameLink" type="url" inputmode="url" autocomplete="url" placeholder="粘贴 GameHub 游戏分享链接" aria-describedby="formMessage"><button type="submit">开始这局游戏</button></form><p class="form-message" id="formMessage" aria-live="polite">仅支持 GameHub 的游戏分享链接。</p>
        </div>
      </div>
    </section>
    <div class="below"><a class="demo" href="play-v2.html?game=wheel"><em>▶</em>没有链接？试玩幸运转盘</a></div>
    <div class="chips"><span class="chip">即时开玩</span><span class="chip">玩家不可编辑</span><span class="chip">分享链接直达</span></div><p class="foot">GAMEHUB / PLAYER MODE / NO CONFIG ACCESS</p>
  </main>
  <script>(function(){var form=document.getElementById('openGameForm'),input=document.getElementById('gameLink'),message=document.getElementById('formMessage'),historyKey='gamehub-player-history';function remember(url){try{var list=JSON.parse(localStorage.getItem(historyKey)||'[]');list=list.filter(function(item){return item.url!==url.href});list.unshift({url:url.href,name:url.searchParams.get('game')||'朋友分享的游戏',at:Date.now()});localStorage.setItem(historyKey,JSON.stringify(list.slice(0,12)))}catch(error){}}form.addEventListener('submit',function(event){event.preventDefault();var value=input.value.trim();if(!value){message.textContent='请粘贴朋友分享给你的游戏链接。';message.classList.add('is-error');input.focus();return}try{var url=new URL(value,location.href);if(url.protocol!==location.protocol||url.host!==location.host||!/\.html$/.test(url.pathname))throw new Error('invalid');remember(url);location.assign(url.href)}catch(error){message.textContent='这不是可打开的 GameHub 游戏链接，请检查后重试。';message.classList.add('is-error')}});input.addEventListener('input',function(){message.textContent='仅支持 GameHub 的游戏分享链接。';message.classList.remove('is-error')})}())</script>
</body></html>
