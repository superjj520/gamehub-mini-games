<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幸运转盘 · GameHub</title><link rel="stylesheet" href="design-system.css"><style>
:root{--ink:#080912;--cyan:#45edd3;--pink:#ff5987;--gold:#ffc84d;--line:#29304b}*{box-sizing:border-box}body{min-height:100dvh;margin:0;background:radial-gradient(circle at 50% 8%,#29255a,transparent 31rem),radial-gradient(circle at 12% 90%,rgba(255,89,135,.14),transparent 25rem),var(--ink);color:#f3f0fb;font-family:var(--font-body)}.play-top{display:flex;justify-content:space-between;padding:22px 26px;color:#aca6ba;font:800 11px var(--font-mono);letter-spacing:.1em}.play-top b{color:var(--cyan)}main{display:grid;place-items:center;min-height:calc(100dvh - 68px);padding:20px}.play-stage{text-align:center}.play-stage small{color:var(--cyan);font:800 10px var(--font-mono);letter-spacing:.15em}.play-stage h1{margin:8px 0 4px;font-size:clamp(29px,5vw,46px);letter-spacing:-.06em}.play-stage p{margin:0 0 21px;color:#aaa4bb;font-size:13px}.wheel-player{position:relative;width:min(520px,86vw);margin:auto;filter:drop-shadow(0 20px 38px rgba(0,0,0,.48))}.wheel-svg{display:block;width:100%;overflow:visible}.wheel-rotor{transform-origin:250px 250px}.wheel-sector path{stroke:rgba(255,255,255,.26);stroke-width:1}.wheel-sector.is-winner path{filter:brightness(1.38);stroke:white;stroke-width:4}.wheel-label{fill:#080915;font:800 12px var(--font-display)}.wheel-label-icon{font-size:18px}.wheel-core-ring{fill:#0c0d1e;stroke:rgba(255,255,255,.18);stroke-width:3}.wheel-core{fill:#0c0d1e;stroke:var(--cyan);stroke-width:3}.wheel-pointer{position:absolute;z-index:2;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:36px solid var(--gold);filter:drop-shadow(0 0 9px var(--gold))}.spin{margin-top:24px;min-width:232px;border:0;padding:15px;background:var(--gold);color:#221600;box-shadow:inset 0 -4px 0 rgba(110,65,0,.28);font:900 16px var(--font-display);cursor:pointer}.spin:disabled{opacity:.56;cursor:wait}.result{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:rgba(2,3,9,.72);backdrop-filter:blur(8px)}.result[hidden]{display:none}.result-card{width:min(390px,100%);padding:29px;border:1px solid var(--gold);background:#111329;box-shadow:0 0 50px rgba(255,200,77,.18)}.result-card small{color:var(--cyan);font:800 10px var(--font-mono);letter-spacing:.12em}.result-card h2{margin:12px 0 22px;font-size:31px}.result-actions{display:flex;gap:9px}.result-actions button{flex:1;border-radius:0}.error{max-width:430px;padding:24px;border:1px solid var(--pink);background:#151225}.error a{color:var(--cyan)}@media(max-width:600px){.play-top{padding:18px}.result-actions{flex-direction:column}}
</style><body><header class="play-top"><span>GAME<b>HUB</b> / PLAY</span><span>分享游戏 · 不可编辑</span></header><main id="app"></main><div class="result" id="result" hidden><section class="result-card"><small>THIS ROUND / RESULT</small><h2 id="resultName"></h2><div class="result-actions"><button class="btn btn-ghost" id="again">再玩一次</button><button class="btn btn-accent" id="share">分享游戏</button></div></section></div><script src="games/wheel/config.js"></script><script src="games/wheel/engine.js"></script><script src="games/wheel/player.js"></script><script src="platform/sharing/browser-share-service.js"></script><script>(async function(){var query=new URLSearchParams(location.search),ref=query.get('config'),shares=GameHubBrowserShareService.createBrowserShareService(localStorage),record=ref&&await shares.resolve(ref),config=record?GameHubWheelConfig.normalizeConfig(record.payload):GameHubWheelConfig.createDefaultConfig(),app=document.getElementById('app');if(ref&&!record){app.innerHTML='<section class="error"><h1>这个分享链接不可用</h1><p>它可能已失效，或不在当前浏览器的数据中。</p><a href="index.html">返回玩家大厅</a></section>';return}app.innerHTML='<section class="play-stage"><small>FRIENDLY WHEEL / READY</small><h1>'+config.title+'</h1><p>按下按钮，看看这一局会停在哪里。</p><div id="wheel"></div><button class="spin" id="spin">开始抽奖</button></section>';var player=GameHubWheelPlayer.createPlayer({config:config});player.mount(document.getElementById('wheel'));var result=document.getElementById('result'),resultName=document.getElementById('resultName'),spin=document.getElementById('spin');spin.onclick=async function(){var engine=GameHubWheelEngine.createEngine({config:config}),outcome=engine.spin().complete();spin.disabled=true;await player.spin(outcome);resultName.textContent=outcome.prize.icon+' '+outcome.prize.name;result.hidden=false;spin.disabled=false};document.getElementById('again').onclick=function(){result.hidden=true;player.reset()};document.getElementById('share').onclick=async function(){var url=location.href;if(navigator.share){try{await navigator.share({title:config.title,url:url});return}catch(error){}}try{await navigator.clipboard.writeText(url);this.textContent='链接已复制'}catch(error){this.textContent='请复制地址栏链接'}}}())</script></body></html>
