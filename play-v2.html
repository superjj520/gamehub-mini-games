<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub 新平台</title><link rel="stylesheet" href="design-system.css"><body><main style="min-height:100vh;display:grid;place-items:center;gap:16px"><section id="game" aria-live="polite"></section><button id="spin" class="btn btn-primary">开始抽奖</button><p id="result"></p></main><script src="games/wheel/config.js"></script><script src="games/wheel/engine.js"></script><script src="games/wheel/player.js"></script><script>var config=GameHubWheelConfig.normalizeConfig({prizes:[{name:'惊喜大奖',weight:1},{name:'谢谢参与',weight:1}]});var engine=GameHubWheelEngine.createEngine({config:config}),player=GameHubWheelPlayer.createPlayer({config:config});player.mount(document.getElementById('game'));document.getElementById('spin').onclick=function(){var spin=engine.spin();var outcome=spin.complete();document.getElementById('result').textContent='结果：'+outcome.prize.name;};</script></body></html>
