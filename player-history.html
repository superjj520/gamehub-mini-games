<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub · 游玩记录</title><link rel="stylesheet" href="design-system.css"><style>
  :root{--ink:#070712;--cyan:#3ff0d0;--pink:#ff4e82;--gold:#ffc64b;--line:rgba(205,198,255,.19)}*{box-sizing:border-box}body{min-height:100dvh;background:radial-gradient(circle at 80% 0,rgba(123,87,255,.2),transparent 25rem),var(--ink);color:#f5f2ff;font-family:var(--font-body)}a{text-decoration:none;color:inherit}.top{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:auto;padding:22px 26px;border-bottom:1px solid var(--line)}.brand{font:900 21px/1 var(--font-display);letter-spacing:-.06em}.brand b{color:var(--cyan)}.back{color:#aaa7bc;font-size:13px}.back:hover{color:#fff}main{width:min(900px,100%);margin:auto;padding:72px 26px}.eyebrow{color:var(--cyan);font:800 11px var(--font-mono);letter-spacing:.13em}h1{margin:12px 0 34px;font-size:clamp(34px,5vw,54px);letter-spacing:-.06em}.records{display:grid;gap:10px}.record{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px;border:1px solid var(--line);background:rgba(16,17,38,.76)}.record:hover{border-color:var(--cyan)}.record__type{color:var(--gold);font:800 10px var(--font-mono);letter-spacing:.09em}.record h2{margin-top:4px;font-size:18px}.record time{color:#89849c;font-size:11px}.record .btn{border-radius:0}.empty{padding:52px 24px;border:1px dashed rgba(63,240,208,.35);background:rgba(63,240,208,.035);text-align:center}.empty i{display:grid;place-items:center;width:48px;height:48px;margin:auto;border:1px solid var(--cyan);border-radius:50%;color:var(--cyan);font-style:normal;font-size:22px}.empty h2{margin:16px 0 7px;font-size:24px}.empty p{color:#aaa7bc;font-size:14px}.empty .btn{margin-top:22px;border-radius:0}.note{margin-top:28px;color:#757087;font:10px var(--font-mono);letter-spacing:.1em}@media(max-width:600px){.top{padding:18px}.record{align-items:flex-start;flex-direction:column}.record .btn{width:100%}main{padding:48px 18px}}
</style></head><body><header class="top"><a class="brand" href="index.html">GAME<b>HUB</b></a><a class="back" href="index.html">← 返回玩家大厅</a></header><main><p class="eyebrow">PLAYER HISTORY / 仅你打开过的游戏</p><h1>游玩记录</h1><section class="records" id="records" aria-live="polite"></section><section class="empty" id="empty" hidden><i>◉</i><h2>你还没有玩过游戏</h2><p>让朋友发一个游戏链接给你，打开后会自动记录在这里。</p><a class="btn btn-accent" href="index.html">打开分享游戏</a></section><p class="note">这里不会推荐游戏，也不会出现公共游戏库。</p></main><script>(function(){var key='gamehub-player-history',records=document.getElementById('records'),empty=document.getElementById('empty');function formatTime(time){try{return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(time))}catch(error){return '刚刚'}}function label(value){var names={wheel:'幸运转盘',monopoly:'大富翁',quiz:'答题挑战'};return names[value]||'朋友分享的游戏'}var list=[];try{list=JSON.parse(localStorage.getItem(key)||'[]')}catch(error){}if(!Array.isArray(list)||!list.length){empty.hidden=false;return}records.innerHTML=list.map(function(item){return '<article class="record"><div><p class="record__type">SHARED GAME</p><h2>'+label(item.name)+'</h2><time>'+formatTime(item.at)+'</time></div><a class="btn btn-ghost" href="'+item.url+'">再玩一次</a></article>'}).join('')})();</script></body></html>
